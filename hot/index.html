<!DOCTYPE html>
<html>

<head>

<title>Hot Drinks</title>

<link rel="stylesheet" href="../hot.css">

</head>

<body>

<div class="container fade">

    <img src="../assets/images/hot.png" class="menu-image">

    <div class="spotlight"></div>
<div class="recommend-text"></div>
</div>

<script src="../script.js"></script>

<script>

const spotlight = document.querySelector(".spotlight");
const positions = [

    { top:"36%", left:"24%" },
    { top:"44%", left:"24%" },
    { top:"52%", left:"24%" },
    { top:"60%", left:"24%" },

    { top:"36%", left:"69%" },
    { top:"48%", left:"69%" },
    { top:"60%", left:"69%" }

];


let current = 0;

function moveSpotlight(){

    spotlight.style.top = positions[current].top;
    spotlight.style.left = positions[current].left;

    current++;

    if(current >= positions.length){
        current = 0;
    }

}

moveSpotlight();

setInterval(moveSpotlight, 4000);

</script>

</body>

</html>
