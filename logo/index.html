<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>San Sebastian</title>

<link rel="stylesheet" href="../hot.css">

<style>

img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    background:black;

    animation:
    logoIntro 4s ease forwards;
}

@keyframes logoIntro{

    0%{

        opacity:0;

        transform:scale(0.92);
    }

    100%{

        opacity:1;

        transform:scale(1);
    }
}

</style>

</head>

<body class="logo-page">

<div class="container">

<img src="../assets/images/logo.png"
class="menu-image">

</div>

</body>
